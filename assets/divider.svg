<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="100%" height="30">
  <defs>
    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="0"/>
      <stop offset="70%" stop-color="#FF2A5F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2A5F" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="lineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A5F" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FF2A5F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2A5F" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Web Strand -->
  <line x1="50" y1="15" x2="470" y2="15" stroke="url(#lineGradLeft)" stroke-width="2" filter="url(#glow)"/>
  <!-- Left Decorative Web Threads -->
  <path d="M 350 15 Q 380 5 410 15 Q 440 25 470 15" stroke="#FF2A5F" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Center Spider Emblem -->
  <g transform="translate(500, 15)">
    <circle cx="0" cy="0" r="12" fill="#180716" stroke="#FF2A5F" stroke-width="1.5" filter="url(#glow)"/>
    <!-- Spider Body & Legs -->
    <ellipse cx="0" cy="2" rx="3.5" ry="5" fill="#FF2A5F"/>
    <circle cx="0" cy="-4" r="2.5" fill="#FF2A5F"/>
    <!-- Legs Left -->
    <path d="M -2 -4 Q -7 -9 -10 -5" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
    <path d="M -3 -2 Q -9 -6 -11 0" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
    <path d="M -3 1 Q -9 4 -10 8" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
    <path d="M -2 4 Q -7 9 -8 11" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
    <!-- Legs Right -->
    <path d="M 2 -4 Q 7 -9 10 -5" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
    <path d="M 3 -2 Q 9 -6 11 0" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
    <path d="M 3 1 Q 9 4 10 8" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
    <path d="M 2 4 Q 7 9 8 11" stroke="#FF2A5F" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Right Web Strand -->
  <line x1="530" y1="15" x2="950" y2="15" stroke="url(#lineGradRight)" stroke-width="2" filter="url(#glow)"/>
  <!-- Right Decorative Web Threads -->
  <path d="M 530 15 Q 560 5 590 15 Q 620 25 650 15" stroke="#FF2A5F" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
