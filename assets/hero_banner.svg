<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C14"/>
      <stop offset="50%" stop-color="#160914"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>

    <!-- Crimson Glow Filter -->
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Linear Metallic Gradient for Spider Emblem -->
    <linearGradient id="spiderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B6B"/>
      <stop offset="50%" stop-color="#E60039"/>
      <stop offset="100%" stop-color="#990024"/>
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B6B"/>
      <stop offset="50%" stop-color="#3A1525"/>
      <stop offset="100%" stop-color="#FF2A5F"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="996" height="356" x="2" y="2" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Background Spider Web Grid (Vector Art) -->
  <g opacity="0.18" stroke="#FF2A5F" stroke-width="1" fill="none">
    <!-- Web Center Left -->
    <circle cx="160" cy="180" r="40"/>
    <circle cx="160" cy="180" r="80"/>
    <circle cx="160" cy="180" r="130"/>
    <circle cx="160" cy="180" r="190"/>
    <line x1="160" y1="180" x2="160" y2="0"/>
    <line x1="160" y1="180" x2="160" y2="360"/>
    <line x1="160" y1="180" x2="0" y2="180"/>
    <line x1="160" y1="180" x2="400" y2="180"/>
    <line x1="160" y1="180" x2="30" y2="50"/>
    <line x1="160" y1="180" x2="290" y2="310"/>
    <line x1="160" y1="180" x2="30" y2="310"/>
    <line x1="160" y1="180" x2="290" y2="50"/>

    <!-- Web Center Right Upper -->
    <circle cx="880" cy="80" r="30"/>
    <circle cx="880" cy="80" r="70"/>
    <circle cx="880" cy="80" r="120"/>
    <line x1="880" y1="80" x2="1000" y2="80"/>
    <line x1="880" y1="80" x2="760" y2="80"/>
    <line x1="880" y1="80" x2="880" y2="0"/>
    <line x1="880" y1="80" x2="880" y2="220"/>
    <line x1="880" y1="80" x2="980" y2="180"/>
    <line x1="880" y1="80" x2="780" y2="-20"/>
  </g>

  <!-- Glowing Cyber Grid Overlay Line -->
  <path d="M 0 320 Q 250 290 500 320 T 1000 300" stroke="#FF2A5F" stroke-width="1.5" fill="none" opacity="0.4" filter="url(#subtleGlow)"/>

  <!-- LEFT HERO EMBLEM: Female Spider Tech Avatar -->
  <g transform="translate(45, 45)">
    <!-- Hexagonal Glow Ring -->
    <polygon points="135,10 240,70 240,190 135,250 30,190 30,70" fill="#140612" stroke="url(#spiderRed)" stroke-width="3" filter="url(#glowRed)" opacity="0.8"/>
    <polygon points="135,18 232,74 232,186 135,242 38,186 38,74" fill="#0D0712" stroke="#FF2A5F" stroke-width="1" opacity="0.5"/>

    <!-- Female Tech Superhero Silhouette with Spider Suit Elements -->
    <!-- Head / Hood / Mask Outline -->
    <path d="M 135 55 
             C 110 55, 92 75, 92 105 
             C 92 135, 110 155, 135 160 
             C 160 155, 178 135, 178 105 
             C 178 75, 160 55, 135 55 Z" 
          fill="#1C0917" stroke="#FF3B6B" stroke-width="2"/>

    <!-- Sleek Tech Spider Mask Eyes (Glowing Cyan/White Spider Eyes) -->
    <path d="M 105 100 C 112 95, 126 95, 129 108 C 122 112, 110 110, 105 100 Z" fill="#FFFFFF" stroke="#00F0FF" stroke-width="1.5" filter="url(#subtleGlow)"/>
    <path d="M 165 100 C 158 95, 144 95, 141 108 C 148 112, 160 110, 165 100 Z" fill="#FFFFFF" stroke="#00F0FF" stroke-width="1.5" filter="url(#subtleGlow)"/>

    <!-- Hair / Sleek ponytail flow -->
    <path d="M 94 85 C 80 95, 75 125, 78 150 C 82 135, 88 110, 96 95 Z" fill="#FF2A5F" opacity="0.8"/>
    <path d="M 176 85 C 190 95, 195 125, 192 150 C 188 135, 182 110, 174 95 Z" fill="#FF2A5F" opacity="0.8"/>

    <!-- Spider Tech Collar & Suit Shoulders -->
    <path d="M 90 155 L 60 215 C 85 230, 185 230, 210 215 L 180 155 C 160 170, 110 170, 90 155 Z" fill="#250B1E" stroke="#FF2A5F" stroke-width="1.5"/>

    <!-- Spider Chest Emblem -->
    <path d="M 135 170 L 130 185 L 120 180 L 128 192 L 115 198 L 132 202 L 135 218 L 138 202 L 155 198 L 142 192 L 150 180 L 140 185 Z" fill="url(#spiderRed)" filter="url(#subtleGlow)"/>

    <!-- Floating Cyber Particles -->
    <circle cx="50" cy="50" r="3" fill="#00F0FF" opacity="0.8" filter="url(#subtleGlow)"/>
    <circle cx="220" cy="60" r="2.5" fill="#FF2A5F" opacity="0.9" filter="url(#subtleGlow)"/>
    <circle cx="235" cy="180" r="3" fill="#00F0FF" opacity="0.7"/>
    <circle cx="35" cy="170" r="2" fill="#FF3B6B" opacity="0.8"/>
  </g>

  <!-- RIGHT TEXT CONTENT & IDENTITY -->
  <g transform="translate(320, 60)">
    <!-- Superhero Status Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#2A0B1A" stroke="#FF2A5F" stroke-width="1"/>
    <text x="14" y="18" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="700" font-size="11" fill="#FF6B8B" letter-spacing="1.5">
      🕷️ SPIDER-TECH DEVELOPER
    </text>

    <!-- Main Name Title -->
    <text x="0" y="75" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="1">
      SHAKRA
    </text>
    <!-- Subtitle Name / Handle -->
    <text x="195" y="75" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#FF2A5F" filter="url(#subtleGlow)">
      @shakra-codes
    </text>

    <!-- Professional Tagline -->
    <text x="0" y="112" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="600" font-size="19" fill="#E2E8F0">
      Full-Stack Web Weaver &amp; Intelligent Automation Engineer
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 135)">
      <!-- Badge 1: Web Dev -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#180C1E" stroke="#FF3B6B" stroke-width="1"/>
      <text x="12" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FF9EAF">🌐 Web Dev</text>

      <!-- Badge 2: Laravel / PHP -->
      <rect x="140" y="0" width="135" height="30" rx="8" fill="#180C1E" stroke="#FF2A5F" stroke-width="1"/>
      <text x="152" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FF9EAF">⚡ Laravel &amp; PHP</text>

      <!-- Badge 3: React & Node -->
      <rect x="285" y="0" width="145" height="30" rx="8" fill="#180C1E" stroke="#00F0FF" stroke-width="1"/>
      <text x="297" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#70F3FF">⚛️ React &amp; Node.js</text>

      <!-- Badge 4: WordPress -->
      <rect x="440" y="0" width="130" height="30" rx="8" fill="#180C1E" stroke="#FF2A5F" stroke-width="1"/>
      <text x="452" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FF9EAF">🧩 WordPress</text>
    </g>

    <g transform="translate(0, 175)">
      <!-- Badge 5: AI & Automation -->
      <rect x="0" y="0" width="165" height="30" rx="8" fill="#180C1E" stroke="#00F0FF" stroke-width="1"/>
      <text x="12" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#70F3FF">🤖 AI &amp; Automation</text>

      <!-- Badge 6: Responsive UI -->
      <rect x="175" y="0" width="155" height="30" rx="8" fill="#180C1E" stroke="#FF3B6B" stroke-width="1"/>
      <text x="187" y="19" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#FF9EAF">✨ Responsive UI/UX</text>
    </g>

    <!-- Bottom Motto Banner -->
    <text x="0" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-style="italic" font-size="13" fill="#A0AEC0">
      "Weaving clean code, scalable architecture &amp; modern digital webs."
    </text>
  </g>
</svg>
